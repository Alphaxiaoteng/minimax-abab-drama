<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<meta name="description" content="沉浸式互动推理剧 Agent：MiniMax 文本与拟真语音驱动的移动端优先剧场">
<title>沉浸式互动推理剧 Agent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0a12'/%3E%3Cpath d='M20 40c4-14 20-14 24 0' stroke='%23e8b45a' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='26' r='3' fill='%23e8b45a'/%3E%3Ccircle cx='39' cy='26' r='3' fill='%23e8b45a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="theme-calm">
<noscript><p class="noscript">本剧场需要 JavaScript 才能进行对话。</p></noscript>

<header class="topbar">
  <h1 class="brand">沉浸式互动推理剧</h1>
  <p class="tagline" id="app-tagline">MiniMax 文本 + 拟真语音 · 离线可玩</p>
</header>

<main class="layout">
  <!-- 左栏：人物 / 线索 / 状态 -->
  <aside class="panel" aria-label="人物与线索面板">
    <section class="personas" aria-labelledby="personas-heading">
      <h2 id="personas-heading">选择人物</h2>
      <div class="persona-grid" id="persona-grid" role="list"></div>
    </section>

    <section class="hud" id="hud" hidden aria-label="剧情状态">
      <div class="phase-row">
        <span class="phase-label" id="phase-label">阶段：—</span>
        <button type="button" class="ghost-btn" id="end-btn" aria-label="结束本场并重新选择人物">散场</button>
      </div>
      <div class="meter" role="progressbar" aria-label="亲密度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="trust-bar">
        <span class="meter-name">亲密度</span>
        <span class="meter-track"><span class="meter-fill" id="trust-fill"></span></span>
        <span class="meter-value" id="trust-value">0</span>
      </div>
      <div class="meter" role="progressbar" aria-label="紧张度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="tension-bar">
        <span class="meter-name">紧张度</span>
        <span class="meter-track"><span class="meter-fill" id="tension-fill"></span></span>
        <span class="meter-value" id="tension-value">0</span>
      </div>
      <div class="clues" aria-labelledby="clues-heading">
        <h3 id="clues-heading">已揭示线索</h3>
        <ul id="clue-list" class="clue-list"></ul>
      </div>
    </section>
  </aside>

  <!-- 右栏：舞台（对话） -->
  <section class="stage" aria-label="对话舞台">
    <div class="welcome" id="welcome">
      <p>选一位人物开场。每位人物都有独立声线与情绪光谱。</p>
    </div>

    <div class="messages" id="messages" aria-live="polite" hidden></div>

    <form class="composer" id="composer" hidden>
      <label class="sr-only" for="user-input">输入台词</label>
      <input id="user-input" name="text" type="text" autocomplete="off" placeholder="说点什么…" maxlength="500">
      <button type="submit" id="send-btn" aria-label="发送台词">落子</button>
    </form>
  </section>
</main>

<!-- 每轮回复的语音条（含手动播放按钮，绝不自动播放） -->
<template id="reply-audio-tpl">
  <div class="voice-bar">
    <button type="button" class="play-btn" aria-label="播放语音">▶</button>
    <span class="waveform" aria-hidden="true"></span>
    <span class="duration"></span>
    <audio preload="auto"></audio>
  </div>
</template>

<div class="error-bar" id="error-bar" role="alert" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INSPECT-AI Pro · 工业视觉质检终端 (立讯/宁德时代级)</title>
<style>
/* ===== 设计令牌 ===== */
:root {
  --bg: #0b0f14; --panel: #131a23; --panel-2: #182231; --panel-3: #1f2b3a;
  --line: #26333f; --line-soft: #1e2a36;
  --cyan: #22d3ee; --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
  --purple: #a78bfa; --blue: #3b82f6;
  --txt: #e6edf3; --txt-dim: #93a4b5; --txt-faint: #5b6b7c;
  --mono: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --r: 8px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--txt); font-family: var(--sans); font-size: 13px; overflow: hidden; }
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
.num, .mono { font-variant-numeric: tabular-nums; font-family: var(--mono); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); background: var(--panel-2); }
.card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 12px; }
.sect-title { font-size: 11px; letter-spacing: .12em; color: var(--txt-faint); text-transform: uppercase; margin: 0 0 8px; font-weight: 600; }
.muted { color: var(--txt-dim); }.faint { color: var(--txt-faint); }

/* ===== 顶部栏 ===== */
header#topbar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: linear-gradient(180deg, #101823, #0d141c); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
#brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
#brand .logo { width: 34px; height: 34px; border-radius: 9px; color: #04191f; font-weight: 800; background: linear-gradient(140deg, #0e7490, #22d3ee); display: grid; place-items: center; font-size: 15px; box-shadow: 0 0 16px rgba(34, 211, 238, .35); }
#brand h1 { font-size: 15px; font-weight: 700; letter-spacing: .08em; margin: 0; }
#brand .subtitle { font-size: 11px; color: var(--txt-dim); white-space: nowrap; }
#top-actions { display: flex; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; background: var(--panel-3); font-weight: 600; transition: all .15s; font-size: 12px; }
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: linear-gradient(140deg, #0e7490, #22d3ee); color: #04191f; border: 0; }
.btn.icon { padding: 7px; width: 36px; height: 36px; display: grid; place-items: center; }

/* ===== 三栏布局 ===== */
main#layout { height: calc(100vh - 56px); display: grid; grid-template-columns: 300px minmax(0, 1fr) 400px; gap: 1px; background: var(--line-soft); }
main#layout > section { background: var(--bg); overflow-y: auto; }
#left { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
#center { display: flex; flex-direction: column; overflow: hidden !important; position: relative; }
#right { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* ===== 左侧控制区 ===== */
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 11px; color: var(--txt-dim); }
select, input[type="text"], input[type="number"] { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; outline: none; }
select:focus, input:focus { border-color: var(--cyan); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#drop { border: 1.5px dashed #33465a; border-radius: var(--r); background: var(--panel); padding: 16px; text-align: center; cursor: pointer; transition: all .15s; }
#drop:hover, #drop.hot { border-color: var(--cyan); background: #10212b; }
#drop .ic { font-size: 20px; color: var(--cyan); }
#drop .l1 { font-size: 12px; margin-top: 4px; }
#drop .l2 { font-size: 10.5px; color: var(--txt-faint); margin-top: 2px; }
.switch { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.switch button { flex: 1; background: transparent; border: 0; border-radius: 5px; padding: 6px 4px; color: var(--txt-dim); font-size: 12px; }
.switch button.on { background: var(--cyan); color: #04191f; font-weight: 600; }
.btn-w { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 9px; background: var(--panel-3); font-weight: 600; transition: all .15s; }
.btn-w:hover { border-color: var(--cyan); }
.btn-w.primary { background: linear-gradient(140deg, #0e7490, #22d3ee); color: #04191f; border: 0; }

/* ===== 中间画布区 ===== */
#canvas-wrap { flex: 1; position: relative; overflow: hidden; display: flex; }
#stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 16px; min-width: 0; }
#imgbox { position: relative; line-height: 0; max-width: 100%; max-height: 100%; transform-origin: center; }
#main-img { max-width: 100%; max-height: 100%; display: block; border-radius: 4px; }
#overlay-layer { position: absolute; inset: 0; pointer-events: none; }
.dbox { position: absolute; border: 1.5px solid var(--amber); border-radius: 3px; pointer-events: auto; cursor: pointer; transition: all .12s; background: rgba(245, 158, 11, .07); color: var(--amber); font-size: 10px; }
.dbox.sev-high { border-color: var(--red); background: rgba(239, 68, 68, .1); color: var(--red); }
.dbox.sev-low { border-color: var(--cyan); background: rgba(34, 211, 238, .07); color: var(--cyan); }
.dbox.hl { box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 14px currentColor; z-index: 3; }
.dbox .tag { position: absolute; top: -17px; left: -1px; font-size: 10px; font-family: var(--mono); background: #0b0f14; border: 1px solid currentColor; color: inherit; padding: 0 4px; border-radius: 3px; white-space: nowrap; line-height: 15px; }
.dbox.gt { border-style: dashed; border-color: #a78bfa; background: rgba(167, 139, 250, .05); pointer-events: none; color: #a78bfa; }
#iou-chip { position: absolute; right: 12px; bottom: 12px; z-index: 5; background: rgba(11,15,20,.85); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font-size: 11px; font-family: var(--mono); }

/* ===== 缺陷显微镜视图 ===== */
#zoom-controls { position: absolute; top: 12px; right: 12px; z-index: 10; display: none; gap: 6px; }
#zoom-controls.visible { display: flex; }
.zoom-btn { width: 36px; height: 36px; border-radius: 6px; background: var(--panel-3); border: 1px solid var(--line); color: var(--txt); display: grid; place-items: center; font-size: 16px; font-weight: bold; }
.zoom-btn:hover { border-color: var(--cyan); }
.zoom-btn.active { background: var(--cyan); color: #04191f; }

/* ===== 右侧检测结果区 ===== */
#verdict-badge { font-size: 14px; font-weight: 700; text-align: center; padding: 10px; border-radius: var(--r); background: var(--panel-2); border: 2px solid var(--line); }
.verdict-pass { color: var(--green); border-color: var(--green); }
.verdict-review { color: var(--amber); border-color: var(--amber); }
.verdict-fail { color: var(--red); border-color: var(--red); }
.defect-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
.defect-card { padding: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; transition: all .15s; position: relative; }
.defect-card:hover { border-color: var(--cyan); }
.defect-card.hl { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(34, 211, 238, .3); }
.defect-card.high { border-left: 3px solid var(--red); }
.defect-card.medium { border-left: 3px solid var(--amber); }
.defect-card.low { border-left: 3px solid var(--cyan); }
.defect-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.defect-card .defect-id { font-weight: 600; font-family: var(--mono); font-size: 12px; }
.defect-card .severity-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--panel-3); border: 1px solid var(--line); }
.defect-card .metrics { font-size: 11px; color: var(--txt-dim); display: flex; gap: 10px; flex-wrap: wrap; }
.defect-card .metric { display: flex; gap: 4px; }
.defect-card .metric .val { color: var(--txt); font-family: var(--mono); }

/* ===== 物理量卡尺面板 ===== */
#caliper-panel { display: none; gap: 8px; }
#caliper-panel.visible { display: flex; }
.caliper-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: 11px; }
.caliper-row:last-child { border-bottom: none; }
.caliper-row .label { color: var(--txt-dim); }
.caliper-row .value { color: var(--txt); font-family: var(--mono); font-weight: 600; }

/* ===== 统计仪表 ===== */
#gauge-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gauge-cell { text-align: center; padding: 8px; background: var(--panel-2); border-radius: 6px; }
.gauge-cell .v { font-size: 18px; font-family: var(--mono); color: var(--cyan); }
.gauge-cell .k { font-size: 10px; color: var(--txt-faint); margin-top: 2px; }

/* ===== 骨架屏 ===== */
#skeleton { position: absolute; inset: 0; z-index: 8; display: none; background: rgba(11,15,20,.86); backdrop-filter: blur(2px); align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
#skeleton.on { display: flex; }
.sk { border-radius: 6px; background: linear-gradient(90deg, #1b2735 25%, #26384b 50%, #1b2735 75%); background-size: 200% 100%; animation: sk 1.3s infinite; }
@keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
#skeleton .big { width: 240px; height: 170px; }
#skeleton .lbl { color: var(--cyan); font-size: 13px; letter-spacing: .05em; }

/* ===== 打印样式 (ISO 证书) ===== */
@media print {
  body * { visibility: hidden; }
  #print-certificate, #print-certificate * { visibility: visible; }
  #print-certificate { position: absolute; left: 0; top: 0; width: 100%; max-width: 800px; padding: 40px; background: #fff; color: #000; }
  .cert-header { border-bottom: 3px solid #000; padding-bottom: 20px; margin-bottom: 30px; }
  .cert-logo { font-size: 24px; font-weight: bold; color: #000; }
  .cert-title { font-size: 18px; text-align: center; margin: 20px 0; font-weight: bold; }
  .cert-section { margin: 15px 0; }
  .cert-label { font-weight: bold; color: #333; font-size: 12px; }
  .cert-value { color: #000; font-size: 13px; margin-top: 4px; font-family: monospace; }
  .cert-verdict { font-size: 20px; font-weight: bold; text-align: center; margin: 30px 0; padding: 15px; border: 3px solid #000; }
  .cert-footer { margin-top: 40px; display: flex; justify-content: space-between; }
  .cert-signature { border-top: 2px solid #000; padding-top: 8px; font-size: 11px; width: 200px; }
}
#print-certificate { display: none; }
</style>
</head>
<body>

<!-- 顶部栏 -->
<header id="topbar">
  <div id="brand">
    <div class="logo">IA</div>
    <div>
      <h1>INSPECT-AI Pro</h1>
      <div class="subtitle">工业视觉质检终端 (立讯/宁德时代标准)</div>
    </div>
  </div>
  <div id="top-actions">
    <button class="btn" onclick="exportISOReport()">📄 导出质检证书</button>
    <button class="btn primary" onclick="runDemo()">🚀 运行演示</button>
  </div>
</header>

<!-- 主布局 -->
<main id="layout">
  <!-- 左侧：控制面板 -->
  <section id="left">
    <div class="card">
      <div class="sect-title">场景选择</div>
      <div class="field">
        <label for="scene-select">工件类型</label>
        <select id="scene-select" onchange="onSceneChange()">
          <option value="gear_surface">齿轮齿面 · 划伤检测</option>
          <option value="bearing_ring">轴承套圈 · 滚道点蚀</option>
          <option value="casting_cover">铝合金压铸件 · 气孔砂眼</option>
          <option value="stamping_shell">冲压覆盖件 · 压痕油污</option>
        </select>
      </div>
      
      <div class="row2" style="margin-top: 8px;">
        <div class="field">
          <label>合成样本</label>
          <div class="switch">
            <button id="kind-ok" class="on" onclick="setKind('ok')">良品</button>
            <button id="kind-ng" onclick="setKind('ng')">缺陷</button>
          </div>
        </div>
        <div class="field">
          <label>缺陷数量</label>
          <input type="number" id="defect-count" value="2" min="0" max="10" />
        </div>
      </div>
      
      <button class="btn-w primary" style="margin-top: 8px;" onclick="generateDemoSample()">🎲 生成合成样本</button>
    </div>
    
    <div class="card">
      <div class="sect-title">图像上传</div>
      <div id="drop" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" onclick="document.getElementById('file-input').click()">
        <div class="ic">📁</div>
        <div class="l1">拖拽或点击上传图片</div>
        <div class="l2">支持 PNG/JPG/BMP/WebP</div>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(event)" />
      </div>
      <div id="file-meta"></div>
    </div>
    
    <div class="card" id="caliper-config" style="display: none;">
      <div class="sect-title">📏 相机校准参数</div>
      <div class="field">
        <label for="pixel-pitch">像素密度 (pixels/mm)</label>
        <input type="number" id="pixel-pitch" value="100" step="1" min="10" />
      </div>
      <div style="margin-top: 6px; font-size: 10px; color: var(--txt-faint);">
        提示：根据相机镜头焦距与传感器尺寸计算，用于将像素转换为物理长度
      </div>
    </div>
    
    <div class="card">
      <div class="sect-title">统计指标</div>
      <div id="gauge-container">
        <div class="gauge-cell"><div class="v num" id="stat-score">-</div><div class="k">综合得分</div></div>
        <div class="gauge-cell"><div class="v num" id="stat-defects">-</div><div class="k">缺陷数</div></div>
        <div class="gauge-cell"><div class="v num" id="stat-latency">-</div><div class="k">耗时 (ms)</div></div>
        <div class="gauge-cell"><div class="v num" id="stat-decision">-</div><div class="k">判定</div></div>
      </div>
    </div>
  </section>
  
  <!-- 中间：画布区 -->
  <section id="center">
    <div id="empty-canvas" style="display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--txt-faint);">
      <div style="font-size: 48px; opacity: 0.2;">🔍</div>
      <div>等待图像输入...</div>
    </div>
    <div id="imgbox" style="display: none;">
      <img id="main-img" alt="Inspection image" />
      <div id="overlay-layer"></div>
      <div id="iou-chip" style="display: none;"></div>
    </div>
    
    <!-- 缺陷显微镜控制 -->
    <div id="zoom-controls">
      <button class="zoom-btn" onclick="zoomOut()" title="缩小">−</button>
      <span id="zoom-level" class="badge" style="padding: 4px 10px;">100%</span>
      <button class="zoom-btn" onclick="zoomIn()" title="放大">+</button>
      <button class="zoom-btn" onclick="resetZoom()" title="重置">⊛</button>
      <button class="zoom-btn" onclick="toggleHeatmapView()" id="heatmap-toggle" title="切换热图">▣</button>
      <button class="zoom-btn" onclick="closeDefectZoom()" title="退出显微模式">✕</button>
    </div>
    
    <div id="skeleton">
      <div class="sk big"></div>
      <div class="lbl">正在处理...</div>
    </div>
  </section>
  
  <!-- 右侧：检测结果 -->
  <section id="right">
    <div class="card">
      <div class="sect-title">质检结论</div>
      <div id="verdict-badge">-</div>
    </div>
    
    <!-- 物理量卡尺面板 -->
    <div class="card" id="caliper-panel">
      <div class="sect-title">📏 缺陷物理量测量</div>
      <div id="caliper-metrics"></div>
    </div>
    
    <div class="card">
      <div class="sect-title">缺陷列表</div>
      <div id="defect-list" class="defect-list"></div>
    </div>
    
    <div class="card">
      <div class="sect-title">特征分解</div>
      <div id="breakdown-stats"></div>
      <div id="feature-stats" style="margin-top: 8px;"></div>
    </div>
  </section>
</main>

<!-- 隐藏的元素：用于打印 ISO 证书 -->
<div id="print-certificate"></div>

<script>
// ===== 全局状态 =====
let lastInspect = null;
let lastImageSrc = null;
let tab = "original";
let boxIndex = new Map();
let zoomScale = 1.0;
let zoomTargetId = null;
let heatmapViewMode = "original"; // 'original' | 'residual' | 'sobel'
let pixelPitch = 100; // pixels/mm

// ===== DOM 辅助函数 =====
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(v, d=2) { return Number(v).toFixed(d); }

// ===== 图片渲染与控制 =====
async function renderImage(src, result, gt=null) {
  $("skeleton").classList.add("on");
  $("empty-canvas").style.display = "none";
  $("imgbox").style.display = "block";
  const img = $("main-img");
  
  img.onload = () => {
    drawBoxes();
    $("skeleton").classList.remove("on");
  };
  
  img.src = src;
  lastImageSrc = src;
  lastInspect = { result, ground_truth: gt || null };
  
  resetZoom();
  updateZoomControls();
  applyTab();
  renderVerdict(result);
  renderGauge(result);
  renderBreakdown(result);
  renderFeatures(result);
  renderDefectList(result);
  renderGroundTruthChip();
}

// ===== 缩放控制（4K 缺陷显微镜）=====
function zoomIn() {
  if (zoomScale < 4.0) zoomScale = Math.min(4.0, zoomScale * 1.25);
  applyZoom();
}

function zoomOut() {
  if (zoomScale > 0.25) zoomScale = Math.max(0.25, zoomScale / 1.25);
  applyZoom();
}

function resetZoom() {
  zoomScale = 1.0;
  zoomTargetId = null;
  applyZoom();
  updateZoomControls();
}

function applyZoom() {
  const imgbox = $("imgbox");
  imgbox.style.transform = `scale(${zoomScale})`;
  $("zoom-level").textContent = `${Math.round(zoomScale * 100)}%`;
}

function updateZoomControls() {
  const controls = $("zoom-controls");
  if (zoomTargetId || heatmapViewMode !== "original") {
    controls.classList.add("visible");
  } else {
    controls.classList.remove("visible");
  }
}

// ===== 热图视图切换 =====
function toggleHeatmapView() {
  if (!lastInspect || !lastInspect.result) return;
  
  const modes = ["original", "residual", "sobel"];
  const currentIndex = modes.indexOf(heatmapViewMode);
  heatmapViewMode = modes[(currentIndex + 1) % modes.length];
  
  const btn = $("heatmap-toggle");
  const modeNames = { original: "原图", residual: "傅里叶残差", sobel: "Sobel 梯度" };
  btn.textContent = modeNames[heatmapViewMode] || "▣";
  btn.classList.toggle("active", heatmapViewMode !== "original");
  
  // TODO: 实现从 API 获取对应热图数据并显示
  alert(`已切换到 ${modeNames[heatmapViewMode]} 视图\n此功能需要后端提供对应的热图数据接口`);
}

// ===== 缺陷框绘制 =====
function drawBoxes() {
  const layer = $("overlay-layer");
  const img = $("main-img");
  layer.innerHTML = "";
  boxIndex = new Map();
  if (!lastInspect || !img.naturalWidth) return;
  
  const rect = img.getBoundingClientRect();
  const res = lastInspect.result;
  const hm = res.heatmap_shape || [];
  const kx = rect.width / (hm[1] || res.width || 1);
  const ky = rect.height / (hm[0] || res.height || 1);
  
  layer.style.width = rect.width + "px";
  layer.style.height = rect.height + "px";
  
  (res.defects || []).forEach((d) => {
    const bb = d.bbox || [];
    if (bb.length < 4) return;
    const el = mkBox(bb, kx, ky, d.severity);
    el.title = `${d.defect_id} · ${d.label_cn} · score ${fmt(d.score, 3)}`;
    el.innerHTML = `<span class="tag">${esc(d.defect_id)}</span>`;
    el.addEventListener("mouseenter", () => highlightDefect(String(d.defect_id), true));
    el.addEventListener("mouseleave", () => highlightDefect(String(d.defect_id), false));
    el.addEventListener("click", () => scrollToDefect(String(d.defect_id)));
    layer.appendChild(el);
    boxIndex.set(String(d.defect_id), el);
  });
  
  // 真值 GT
  const gtDefs = lastInspect.ground_truth?.defects || [];
  const gkx = rect.width / (res.width || 1), gky = rect.height / (res.height || 1);
  gtDefs.forEach((g, i) => {
    const bb = g.bbox || g.bbox_xyxy || [];
    if (bb.length < 4) return;
    const el = mkBox(bb, gkx, gky, "gt");
    el.innerHTML = `<span class="tag">GT-${String(i+1).padStart(2,"0")}</span>`;
    layer.appendChild(el);
  });
}

function mkBox(bb, kx, ky, severity) {
  const el = document.createElement("div");
  const cls = severity === "high" ? "sev-high" : severity === "low" ? "sev-low" : "";
  el.className = "dbox " + cls;
  el.style.left = Number(bb[0]) * kx + "px";
  el.style.top = Number(bb[1]) * ky + "px";
  el.style.width = Math.max(6, (Number(bb[2]) - Number(bb[0])) * kx) + "px";
  el.style.height = Math.max(6, (Number(bb[3]) - Number(bb[1])) * ky) + "px";
  return el;
}

// ===== 缺陷列表渲染 =====
function renderDefectList(result) {
  const list = $("defect-list");
  list.innerHTML = "";
  boxIndex.clear();
  
  (result.defects || []).sort((a,b) => b.score - a.score).forEach((d) => {
    const card = document.createElement("div");
    card.className = `defect-card ${d.severity.toLowerCase()}`;
    card.id = `card:${d.defect_id}`;
    boxIndex.set(`card:${d.defect_id}`, card);
    
    const mm = physicalMetrics(d);
    
    card.innerHTML = `
      <div class="header">
        <div class="defect-id">${esc(d.defect_id)} · ${esc(d.label_cn)}</div>
        <div class="severity-badge" style="color: ${getSeverityColor(d.severity)}">${esc(d.severity)}</div>
      </div>
      <div class="metrics">
        <div class="metric"><span class="val">${fmt(d.score, 3)}</span>置信度</div>
        <div class="metric"><span class="val">${mm.area}</span>面积</div>
        <div class="metric"><span class="val">${mm.length}</span>长度</div>
        <div class="metric"><span class="val">${mm.ar}</span>长宽比</div>
      </div>
    `;
    
    card.addEventListener("click", () => scrollToDefect(d.defect_id));
    card.addEventListener("mouseenter", () => highlightDefect(d.defect_id, true));
    card.addEventListener("mouseleave", () => highlightDefect(d.defect_id, false));
    
    list.appendChild(card);
  });
  
  // 显示物理量卡尺面板
  updateCaliperPanel(result);
}

function getSeverityColor(sev) {
  if (sev === "high") return "#ef4444";
  if (sev === "medium") return "#f59e0b";
  return "#22d3ee";
}

// ===== 物理量卡尺计算 =====
function physicalMetrics(defect) {
  const pitch = parseFloat($('pixel-pitch')?.value || pixelPitch) || 100;
  const bb = defect.bbox || [];
  if (bb.length < 4) return { area: "-", length: "-", ar: "-" };
  
  const widthPx = bb[2] - bb[0];
  const heightPx = bb[3] - bb[1];
  
  // 等效长度（最大外接矩形长边）
  const lengthPx = Math.max(widthPx, heightPx);
  const lengthMm = (lengthPx / pitch).toFixed(3);
  
  // 面积（平方毫米）
  const areaPx = widthPx * heightPx;
  const areaMm2 = (areaPx / (pitch * pitch)).toFixed(3);
  
  // 长宽比
  const ar = (Math.max(widthPx, heightPx) / Math.max(1, Math.min(widthPx, heightPx))).toFixed(2);
  
  return {
    area: `${areaMm2} mm²`,
    length: `${lengthMm} mm`,
    ar: ar
  };
}

function updateCaliperPanel(result) {
  const panel = $("caliper-panel");
  const container = $("caliper-metrics");
  
  if (!result.defects || result.defects.length === 0) {
    panel.classList.remove("visible");
    return;
  }
  
  panel.classList.add("visible");
  container.innerHTML = "";
  
  result.defects.slice(0, 3).forEach(d => {
    const mm = physicalMetrics(d);
    const row = document.createElement("div");
    row.className = "caliper-row";
    row.innerHTML = `
      <div class="label">${d.defect_id}: ${d.label_cn}</div>
      <div class="value">${mm.area} | ${mm.length} | AR:${mm.ar}</div>
    `;
    container.appendChild(row);
  });
}

// ===== 判定与统计渲染 =====
function renderVerdict(result) {
  const badge = $("verdict-badge");
  const dec = result.decision || "pass";
  badge.className = "verdict-" + dec;
  const names = { pass: "✓ 合格 · 放行", review: "⚠ 可疑 · 复检", fail: "✗ 不合格 · 拦截" };
  badge.textContent = names[dec] || dec.toUpperCase();
}

function renderGauge(result) {
  $("stat-score").textContent = fmt(result.score, 3);
  $("stat-defects").textContent = result.defect_count || 0;
  $("stat-latency").textContent = fmt(result.processing_ms, 1) + " ms";
  $("stat-decision").textContent = result.decision.toUpperCase();
}

function renderBreakdown(result) {
  const div = $("breakdown-stats");
  const bd = result.breakdown || {};
  div.innerHTML = Object.entries(bd)
    .map(([k,v]) => `<div><span class="faint">${k}:</span> <span class="num">${fmt(v,3)}</span></div>`)
    .join("");
}

function renderFeatures(result) {
  const div = $("feature-stats");
  const feats = result.features || {};
  div.innerHTML = Object.entries(feats)
    .map(([k,v]) => `<div><span class="faint">${k}:</span> <span class="num">${fmt(v,3)}</span></div>`)
    .join("");
}

// ===== 交互功能 =====
function highlightDefect(id, on) {
  const box = boxIndex.get(id);
  const card = boxIndex.get("card:" + id);
  if (box) box.classList.toggle("hl", on);
  if (card) card.classList.toggle("hl", on);
}

function scrollToDefect(id) {
  const card = boxIndex.get("card:" + id);
  if (card) {
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    highlightDefect(id, true);
    setTimeout(() => highlightDefect(id, false), 2000);
  }
}

function renderGroundTruthChip() {
  const chip = $("iou-chip");
  if (!lastInspect?.gtCount) { chip.style.display = "none"; return; }
  chip.style.display = "block";
  chip.textContent = `IoU: ${fmt(lastInspect.iou, 2)}`;
}

// ===== API 调用 =====
async function uploadFile(file) {
  const formData = new FormData();
  formData.append("file", file);
  formData.append("include_overlay", "true");
  
  try {
    const resp = await fetch("/api/v1/inspect", { method: "POST", body: formData });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    console.log("API Response:", data);
    alert(`上传成功！\n响应时间戳：${data.response_timestamp}\n耗时：${data.elapsed_ms}ms\n判定：${data.result.decision}`);
  } catch (err) {
    alert(`上传失败：${err.message}`);
  }
}

async function generateDemoSample() {
  const scene = $("scene-select").value;
  const hasDefect = $("kind-ng").classList.contains("on");
  const n = parseInt($("defect-count").value) || 2;
  
  $("skeleton").classList.add("on");
  try {
    const resp = await fetch("/api/v1/inspect/demo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scene_id: scene, has_defect: hasDefect, n_defects: n, seed: 42 })
    });
    const data = await resp.json();
    renderImage(data.image_png_b64, data.result, data.ground_truth);
  } catch (err) {
    alert(`生成失败：${err.message}`);
    $("skeleton").classList.remove("on");
  }
}

// ===== Drag & Drop =====
function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add("hot"); }
function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove("hot");
  const file = e.dataTransfer.files[0];
  if (file) {
    $("file-meta").textContent = `当前文件：${file.name} (${formatBytes(file.size)})`;
    $("file-meta").style.display = "block";
    uploadFile(file);
  }
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (file) {
    $("file-meta").textContent = `当前文件：${file.name} (${formatBytes(file.size)})`;
    $("file-meta").style.display = "block";
    uploadFile(file);
  }
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}
